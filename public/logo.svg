<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=Montserrat:wght@800&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', 'Arial Black', sans-serif;
        font-weight: 800;
        letter-spacing: 0.05em;
        fill: #FFFFFF;
      }
      .brand-subtitle {
        font-family: 'Cinzel', 'Times New Roman', serif;
        font-weight: 600;
        letter-spacing: 0.15em;
        fill: #F5E6CC;
      }
    </style>
    
    <!-- Gold gradients matching organic hand-drawn logo -->
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB3"/>
      <stop offset="40%" stop-color="#D7B163"/>
      <stop offset="80%" stop-color="#B2873E"/>
      <stop offset="100%" stop-color="#8F6326"/>
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF9E"/>
      <stop offset="100%" stop-color="#D6A751"/>
    </linearGradient>

    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED6A1"/>
      <stop offset="100%" stop-color="#CA9C4D"/>
    </linearGradient>
  </defs>

  <!-- ================= EMBLEM ================= -->
  <g id="emblem" transform="translate(0, 0)">
    <!-- Outer Hand-drawn Ring -->
    <ellipse cx="250" cy="200" rx="110" ry="102" fill="none" stroke="url(#goldStroke)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
    <path d="M142 205 C140 140 185 102 248 100 C310 98 358 142 358 205" fill="none" stroke="#EED6A1" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Left Stalks / Wheat Grass -->
    <g stroke="url(#goldStroke)" stroke-linecap="round" fill="none">
      <path d="M168 215 C164 165 178 135 210 115" stroke-width="5" />
      <path d="M182 222 C178 180 196 150 216 138" stroke-width="4.5" />
      <path d="M198 228 C196 195 214 172 225 160" stroke-width="4" />
      <!-- Wheat tips -->
      <path d="M210 115 Q218 118 215 125" stroke-width="3" />
      <path d="M216 138 Q224 140 220 146" stroke-width="3" />
    </g>

    <!-- Sun / Moon -->
    <circle cx="302" cy="155" r="20" fill="url(#sunGrad)" />

    <!-- House Structure -->
    <g id="house">
      <!-- House Walls & Roof Base -->
      <path d="M212 225 L212 188 L250 152 L288 188 L288 225 Z" fill="url(#houseGrad)" />
      
      <!-- Roof Outline (Overhang) -->
      <path d="M198 192 L250 145 L302 192" fill="none" stroke="#B88A3A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Chimney/Accent -->
      <rect x="272" y="156" width="7" height="12" fill="#B88A3A" />

      <!-- Windows (2x2 Grid) -->
      <g fill="#0B1E36">
        <rect x="240" y="185" width="8" height="8" rx="1" />
        <rect x="252" y="185" width="8" height="8" rx="1" />
        <rect x="240" y="197" width="8" height="8" rx="1" />
        <rect x="252" y="197" width="8" height="8" rx="1" />
      </g>
    </g>

    <!-- Wavy Landscape Fields (Layered Contours) -->
    <g fill="none" stroke="url(#goldStroke)" stroke-linecap="round">
      <path d="M152 230 C190 220 230 240 280 226 C315 216 338 222 346 226" stroke-width="5" />
      <path d="M148 244 C185 235 228 255 278 242 C320 230 342 238 350 242" stroke-width="5.5" />
      <path d="M155 258 C192 250 232 270 280 258 C320 246 338 254 344 260" stroke-width="5" />
      <path d="M168 272 C205 264 242 284 285 274 C318 266 330 274 336 280" stroke-width="4.5" />
      <path d="M185 286 C218 280 248 296 288 288 C310 282 322 290 326 295" stroke-width="4" />
    </g>

    <!-- Lateral Wings (Horizontal Accents) -->
    <path d="M75 272 L150 272" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round" />
    <path d="M42 285 L145 285" stroke="url(#goldStroke)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M350 272 L425 272" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round" />
    <path d="M355 285 L458 285" stroke="url(#goldStroke)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- ================= TYPOGRAPHY BANNERS ================= -->
  <!-- Top Main Box: CERRADO STAY -->
  <g id="cerrado-stay-box" transform="translate(250, 335)">
    <!-- Dark Navy Rectangle -->
    <rect x="-200" y="-26" width="400" height="48" fill="#0B1E36" rx="0" />
    <text x="0" y="9" text-anchor="middle" font-size="34" class="brand-title">CERRADO STAY</text>
  </g>

  <!-- Bottom Subtitle Box: SHORT SEASON RENTAL with flank lines -->
  <g id="subtitle-group" transform="translate(250, 385)">
    <!-- Left connecting line -->
    <line x1="-175" y1="0" x2="-95" y2="0" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Center Navy Box -->
    <rect x="-92" y="-12" width="184" height="24" fill="#0B1E36" />
    <text x="0" y="5" text-anchor="middle" font-size="12" class="brand-subtitle">SHORT SEASON RENTAL</text>
    
    <!-- Right connecting line -->
    <line x1="95" y1="0" x2="175" y2="0" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Subtle bottom accent line -->
  <line x1="200" y1="410" x2="300" y2="410" stroke="url(#goldStroke)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
